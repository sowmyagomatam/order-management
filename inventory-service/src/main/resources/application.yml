spring:
  application:
    name: inventory-service
  jpa:
    show-sql: true
    properties:
      format-sql: true
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: inventory-service


server:
  port: 8082

logging:
  level:
    com.ecommerce.inventory: debug
    org.springframework.web: info