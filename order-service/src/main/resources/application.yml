spring:
  application:
    name: order-service
  jpa:
    show-sql: true
    properties:
      format-sql: true
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: order-service


server:
  port: 8081

logging:
  level:
    com.ecommerce.order: debug
    org.springframework.web: info