spring:
  application:
    name: payment-service
  jpa:
    show-sql: true
    properties:
      format-sql: true
    open-in-view: false


server:
  port: 8083

logging:
  level:
    com.ecommerce.order: debug
    org.springframework.web: info

payment:
  executor:
    pool-size: 10  # Number of concurrent payment processing threads
  gateway:
    timeout-seconds: 10